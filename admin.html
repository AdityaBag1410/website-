<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal – Shri Swaroop Public School</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>
        // Redirect to the main site with the #/admin hash so the React app
        // detects the admin route and opens the Admin Portal directly.
        // This works on any static hosting (Netlify, Vercel, GitHub Pages, etc.)
        (function () {
            var base = window.location.origin + window.location.pathname.replace(/admin\.html$/, '');
            window.location.replace(base + 'index.html#/admin');
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
        }
        .loader {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader h2 { font-size: 1.1rem; color: #f1f5f9; font-weight: 600; margin-bottom: 0.4rem; }
        .loader p { font-size: 0.8rem; color: #94a3b8; }
        .loader a {
            display: inline-block;
            margin-top: 1.2rem;
            padding: 0.5rem 1.2rem;
            background: #f59e0b;
            color: #0f172a;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>Opening Admin Portal…</h2>
        <p>Redirecting to Shri Swaroop Public School CMS</p>
        <a href="index.html#/admin">Open Manually</a>
    </div>
</body>
</html>
