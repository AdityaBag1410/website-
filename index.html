<style>
        /* Mobile & Tablet Global Overflow-X Prevention */
        html, body {
            overflow-x: hidden;
            max-width: 100%;
            width: 100%;
        }

        /* Custom scrollbar and aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #071120;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d97706;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .gold-shimmer {
            background: linear-gradient(120deg, rgba(251, 191, 36, 0) 30%, rgba(251, 191, 36, 0.4) 50%, rgba(251, 191, 36, 0) 70%);
            background-size: 200% 100%;
            animation: shimmer 6s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .glass-dark {
            background: rgba(7, 17, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .dock-glass {
            background: rgba(7, 17, 32, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        @keyframes subtlePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
            50% { transform: scale(1.04); box-shadow: 0 0 0 14px rgba(37, 211, 102, 0); }
        }
        .whatsapp-pulse {
            animation: subtlePulse 2.5s infinite;
        }

        @keyframes tickerMoveL2R {
            0% { transform: translate3d(-50%, 0, 0); }
            100% { transform: translate3d(0%, 0, 0); }
        }
        .animate-ticker-l2r {
            display: flex;
            width: max-content;
            animation: tickerMoveL2R 32s linear infinite;
            will-change: transform;
        }
        .animate-ticker-l2r:hover {
            animation-play-state: paused;
        }

        /* Sliding Gate Animation */
        .gate-slider-viewport {
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .gate-slider-panel {
            will-change: transform;
            transition: transform 1.6s cubic-bezier(0.22, 1, 0.36, 1);
            transform: translate3d(0, 0, 0);
        }

        .gate-slider-panel.slide-open {
            transform: translate3d(104%, 0, 0);
        }

        /* School Notice Board Cork Texture */
        .cork-texture {
            background-color: #d8b88d;
            background-image: 
                radial-gradient(rgba(130, 78, 28, 0.25) 15%, transparent 16%),
                radial-gradient(rgba(95, 52, 12, 0.20) 15%, transparent 16%),
                radial-gradient(rgba(255, 255, 255, 0.15) 15%, transparent 20%);
            background-size: 32px 32px, 48px 48px, 20px 20px;
            background-position: 0 0, 16px 16px, 10px 10px;
        }

        /* Coffee Smart Board Glow */
        @keyframes coffeeBoardGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(180, 83, 9, 0.22), inset 0 0 15px rgba(120, 53, 15, 0.15); }
            50% { box-shadow: 0 0 45px rgba(217, 119, 6, 0.35), inset 0 0 25px rgba(146, 64, 14, 0.25); }
        }
        .coffee-screen-glow {
            animation: coffeeBoardGlow 4s ease-in-out infinite;
        }
    </style>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Constants & Configurations
    const WHATSAPP_NUMBER = "9571865708";
    const PHONE_DISPLAY = "+91 9571865708";
    const EMAIL_DISPLAY = "kumarbagoria@gmail.com";
    const ADDRESS_TEXT = "Pilani Jaipur Highway, Ward No. 8, Tehsil Pilani, District Jhunjhunu, Rajasthan - 333023 (Baggar)";
    const SAINIK_URL = "https://sainik-military-ssps.vercel.app/";
    const MAP_EMBED_URL = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3516.8243111912093!2d75.49939437509944!3d28.18225807591364!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39133c9ecb1b687b%3A0xf8ee3e8657ceec32!2sSwaroop%20Public%20School!5e0!3m2!1sen!2sin!4v1774982690566!5m2!1sen!2sin";

    const SOCIAL_LINKS = [
        { name: 'Facebook', url: 'https://www.facebook.com/swaroop123456/', icon: 'fa-brands fa-facebook-f' },
        { name: 'Instagram', url: 'https://www.instagram.com/kumar.bagoria?igsh=OTkxc2hhc29tMHM=', icon: 'fa-brands fa-instagram' },
        { name: 'YouTube', url: 'https://www.youtube.com/@kumarbagoria/shorts', icon: 'fa-brands fa-youtube' },
        { name: 'LinkedIn', url: 'https://www.linkedin.com/in/kumar-bagoria-9b1a2524b/', icon: 'fa-brands fa-linkedin-in' },
        { name: 'X / Twitter', url: 'https://twitter.com', icon: 'fa-brands fa-x-twitter' }
    ];

    const Icon = ({ name, size = 20, className = "" }) => {
        useEffect(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, [name]);
        return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-flex' }} className={`align-middle ${className}`}></i>;
    };

    const SectionHeading = ({ badge, title, subtitle, light = false, align = "center" }) => {
        const alignment = align === "left" ? "text-left items-start" : "text-center items-center";
        return (
            <div className={`flex flex-col ${alignment} mb-10 sm:mb-14 max-w-3xl ${align === "center" ? "mx-auto px-2 sm:px-0" : ""}`}>
                {badge && (
                    <div className="inline-flex items-center gap-2 px-3 sm:px-4 py-1 rounded-full text-[11px] sm:text-xs font-bold tracking-widest uppercase mb-3 sm:mb-4 shadow-sm border border-amber-500/20 bg-amber-500/10 text-amber-600">
                        <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                        {badge}
                    </div>
                )}
                <h2 className={`text-2xl sm:text-4xl md:text-5xl font-bold font-serif tracking-tight leading-tight ${light ? 'text-white' : 'text-slate-900'}`}>
                    {title}
                </h2>
                {subtitle && (
                    <p className={`mt-3 sm:mt-4 text-sm sm:text-lg font-normal leading-relaxed ${light ? 'text-slate-300' : 'text-slate-600'}`}>
                        {subtitle}
                    </p>
                )}
                <div className={`h-1 w-16 sm:w-20 rounded-full mt-4 sm:mt-6 ${light ? 'bg-amber-400' : 'bg-royal-600'}`}></div>
            </div>
        );
    };

    // Modern Architectural Slider Gate Entrance (No Side Pillars, Black Rods, Sliding Tyres)
    const SchoolGateIntro = ({ onComplete }) => {
        // stages: 'closed' -> 'sliding' -> 'fading' -> 'hidden'
        const [stage, setStage] = useState('closed');

        useEffect(() => {
            // Phone View (< 640px): Skip gate intro immediately on mobile phones
            if (typeof window !== 'undefined' && window.innerWidth < 640) {
                setStage('hidden');
                if (onComplete) onComplete();
                return;
            }

            const origOverflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';

            // Stage 1: Display black rod gate for 750ms, then slide open from left to right
            const timer1 = setTimeout(() => {
                setStage('sliding');
            }, 750);

            // Stage 2: Gate has smoothly glided to the right, fade out intro screen (2500ms)
            const timer2 = setTimeout(() => {
                setStage('fading');
            }, 2500);

            // Stage 3: Clean up and unmount completely (3100ms)
            const timer3 = setTimeout(() => {
                setStage('hidden');
                document.body.style.overflow = origOverflow || '';
                if (onComplete) onComplete();
            }, 3100);

            return () => {
                clearTimeout(timer1);
                clearTimeout(timer2);
                clearTimeout(timer3);
                document.body.style.overflow = origOverflow || '';
            };
        }, []);

        const handleSkip = () => {
            setStage('hidden');
            document.body.style.overflow = '';
            if (onComplete) onComplete();
        };

        if (stage === 'hidden') return null;

        const isSliding = stage === 'sliding' || stage === 'fading';
        const isFading = stage === 'fading';

        return (
            <div 
                className={`hidden sm:flex fixed inset-0 w-full h-full z-[100] flex-col justify-between bg-black overflow-hidden select-none transition-opacity duration-600 ${
                    isFading ? 'opacity-0 pointer-events-none' : 'opacity-100'
                }`}
                style={{ transition: 'opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1)' }}
            >
                {/* 1. School Campus in Bright Morning Daylight (Revealed as Gate Slides Right) */}
                <div className="absolute inset-0 z-0 overflow-hidden">
                    <img 
                        src="/images/schoolimage.png" 
                        alt="Shri Swaroop Public Senior Secondary School Campus" 
                        className={`w-full h-full object-cover transition-all duration-[2600ms] ease-out ${
                            isSliding ? 'scale-105 brightness-105 saturate-[1.05]' : 'scale-100 brightness-95'
                        }`}
                    />
                    {/* Atmospheric Overlays */}
                    <div className="absolute inset-0 bg-gradient-to-t from-white/90 via-white/30 to-slate-900/40"></div>

                    {/* Central Welcome Card in Elegant Frosted Glass */}
                    <div className={`absolute inset-0 flex flex-col items-center justify-center px-4 z-10 transition-all duration-1000 ${
                        isSliding ? 'opacity-100 transform translate-y-0' : 'opacity-0 transform translate-y-6'
                    }`}>
                        <div className="p-3 bg-white/95 rounded-2xl shadow-xl border border-amber-300/60 mb-3 sm:mb-4 backdrop-blur-md">
                            <img src="/images/logo.png" alt="School Logo" className="w-14 h-14 sm:w-20 sm:h-20 object-contain" />
                        </div>
                        <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/15 border border-amber-500/40 text-amber-900 text-[11px] sm:text-xs font-bold uppercase tracking-widest mb-2 backdrop-blur-sm shadow-sm">
                            <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                            <span>Admissions Open 2026-27</span>
                        </div>
                        <h1 className="text-xl sm:text-3xl md:text-5xl font-extrabold font-serif text-slate-900 text-center drop-shadow-sm max-w-3xl leading-tight">
                            SHRI SWAROOP PUBLIC SENIOR SECONDARY SCHOOL
                        </h1>
                        <p className="text-amber-800 text-xs sm:text-base font-semibold mt-1 text-center">
                            Baggar (Jhunjhunu), Rajasthan • RBSE Affiliated
                        </p>
                        <div className="mt-4 px-5 py-2 rounded-full bg-gradient-to-r from-royal-600 to-royal-700 text-white font-bold text-xs uppercase tracking-wider shadow-lg">
                            Welcome Inside Campus Grounds
                        </div>
                    </div>
                </div>

                {/* Top Quick Skip Button */}
                <button
                    onClick={handleSkip}
                    className="absolute top-4 sm:top-6 right-4 sm:right-6 z-50 inline-flex items-center gap-2 px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-full bg-white/85 hover:bg-white text-slate-800 border border-slate-300/80 backdrop-blur-md text-xs font-bold tracking-wider transition-all shadow-lg hover:scale-105 cursor-pointer"
                >
                    <span>Skip Intro</span>
                    <i className="fa-solid fa-arrow-right text-[11px]"></i>
                </button>

                {/* Status Bar at Bottom Center */}
                <div className="absolute bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-50 text-center pointer-events-none">
                    <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/90 backdrop-blur-md border border-amber-400/50 text-amber-900 text-xs font-semibold shadow-lg">
                        <span className={`w-2 h-2 rounded-full ${isSliding ? 'bg-emerald-500 animate-ping' : 'bg-amber-500 animate-pulse'}`}></span>
                        <span>{isSliding ? 'Campus Gate Sliding Open...' : 'Welcome to Shri Swaroop Public School'}</span>
                    </div>
                </div>

                {/* Full-Page Architectural Gate Frame */}
                <div className="relative z-20 w-full h-full flex flex-col justify-between pointer-events-none">
                    {/* Very Minimized Sleek Header Strip */}
                    <div className="w-full relative shrink-0 z-30 bg-black/90 border-b border-neutral-800/80 py-1 sm:py-1.5 px-4 shadow-sm text-center backdrop-blur-md flex items-center justify-between sm:justify-center">
                        <div className="flex items-center gap-2 sm:gap-3 mx-auto">
                            <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                            <span className="text-[10px] sm:text-xs font-semibold tracking-wider text-neutral-200 uppercase">
                                SHRI SWAROOP PUBLIC SENIOR SECONDARY SCHOOL • BAGGAR 
                            </span>
                        </div>
                    </div>

                    {/* Gate Aperture: Full Width (No Side Pillars), Left-to-Right Sliding Black Rod Gate */}
                    <div className="flex-1 w-full flex items-stretch relative gate-slider-viewport overflow-hidden">
                        {/* The Modern Black Rod Sliding Gate with Bottom Tyres */}
                        <div className="w-full h-full relative overflow-hidden">
                            <div className={`w-full h-full gate-slider-panel ${isSliding ? 'slide-open' : ''} relative`}>
                                <svg viewBox="0 0 1200 680" preserveAspectRatio="none" className="w-full h-full drop-shadow-[15px_0_30px_rgba(0,0,0,0.6)]">
                                    <defs>
                                        {/* Deep Black / Charcoal Steel Gradients */}
                                        <linearGradient id="blackFrameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                            <stop offset="0%" stopColor="#27272a" />
                                            <stop offset="50%" stopColor="#18181b" />
                                            <stop offset="100%" stopColor="#09090b" />
                                        </linearGradient>
                                        <linearGradient id="blackRodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                            <stop offset="0%" stopColor="#3f3f46" />
                                            <stop offset="30%" stopColor="#18181b" />
                                            <stop offset="70%" stopColor="#09090b" />
                                            <stop offset="100%" stopColor="#27272a" />
                                        </linearGradient>
                                        <linearGradient id="goldAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stopColor="#fde68a" />
                                            <stop offset="50%" stopColor="#d97706" />
                                            <stop offset="100%" stopColor="#92400e" />
                                        </linearGradient>
                                        <radialGradient id="tyreRubberGrad" cx="50%" cy="50%" r="50%">
                                            <stop offset="60%" stopColor="#1c1917" />
                                            <stop offset="85%" stopColor="#0c0a09" />
                                            <stop offset="100%" stopColor="#292524" />
                                        </radialGradient>
                                    </defs>

                                    {/* Main Outer Perimeter Black Steel Frame */}
                                    <rect x="10" y="25" width="1180" height="585" rx="4" fill="none" stroke="url(#blackFrameGrad)" strokeWidth="8" />

                                    {/* Horizontal Black Structural Rails */}
                                    <rect x="10" y="25" width="1180" height="18" rx="2" fill="url(#blackFrameGrad)" />
                                    <rect x="10" y="70" width="1180" height="10" rx="1" fill="url(#blackFrameGrad)" />
                                    <rect x="10" y="360" width="1180" height="16" rx="2" fill="url(#blackFrameGrad)" />
                                    <rect x="10" y="590" width="1180" height="22" rx="3" fill="url(#blackFrameGrad)" stroke="#27272a" strokeWidth="1" />

                                    {/* Clean Vertical Black Rods / Pickets Across Entire Gate */}
                                    {Array.from({ length: 34 }).map((_, idx) => {
                                        const x = 35 + idx * 34.2;
                                        return (
                                            <g key={`rod-${idx}`}>
                                                {/* Spear / Arrowhead Finial Top */}
                                                <polygon 
                                                    points={`${x-4.5},25 ${x+4.5},25 ${x},8`} 
                                                    fill="#27272a" 
                                                    stroke="#18181b" 
                                                    strokeWidth="1"
                                                />
                                                {/* Decorative Rod Ring Accent at Upper Section */}
                                                {idx % 2 === 0 && (
                                                    <circle cx={x} cy="48" r="7.5" fill="none" stroke="#52525b" strokeWidth="1.5" />
                                                )}
                                                {/* Main Solid Vertical Black Rod */}
                                                <rect 
                                                    x={x - 3} 
                                                    y="25" 
                                                    width="6" 
                                                    height="570" 
                                                    rx="1.5" 
                                                    fill="url(#blackRodGrad)" 
                                                    stroke="#09090b" 
                                                    strokeWidth="0.8" 
                                                />
                                            </g>
                                        );
                                    })}

                                    {/* Center Prestigious Black Medallion with Gold Trim */}
                                    <circle cx="600" cy="360" r="90" fill="#09090b" stroke="#27272a" strokeWidth="5" />
                                    <circle cx="600" cy="360" r="82" fill="#18181b" stroke="url(#goldAccentGrad)" strokeWidth="2.5" />
                                    <circle cx="600" cy="360" r="72" fill="#09090b" stroke="#3f3f46" strokeWidth="1" strokeDasharray="4,3" />

                                    {/* Medallion Text & Insignia */}
                                    <text x="600" y="325" textAnchor="middle" fill="#d4d4d8" fontSize="11" fontFamily="sans-serif" fontWeight="bold" letterSpacing="3">SHRI SWAROOP</text>
                                    <text x="600" y="372" textAnchor="middle" fill="#f59e0b" fontSize="38" fontFamily="serif" fontWeight="black" letterSpacing="1">SSPS</text>
                                    <text x="600" y="398" textAnchor="middle" fill="#a1a1aa" fontSize="10" fontFamily="sans-serif" fontWeight="semibold" letterSpacing="3">BAGGAR • 2001</text>

                                    {/* Black Leading Handle (Right Edge) */}
                                    <rect x="1175" y="300" width="8" height="120" rx="3" fill="#3f3f46" stroke="#18181b" strokeWidth="1" />

                                    {/* Small Sliding Tyres Under the Gate Bottom Rail */}
                                    {[150, 420, 780, 1050].map((wheelX, wIdx) => (
                                        <g key={`tyre-${wIdx}`}>
                                            {/* Heavy Steel Wheel Mounting Fork/Chassis */}
                                            <rect x={wheelX - 10} y="612" width="20" height="28" rx="2" fill="#27272a" stroke="#09090b" strokeWidth="1" />
                                            <circle cx={wheelX} cy="642" r="3" fill="#71717a" />

                                            {/* Outer Rubber Tyre with Tread */}
                                            <circle 
                                                cx={wheelX} 
                                                cy="645" 
                                                r="24" 
                                                fill="url(#tyreRubberGrad)" 
                                                stroke="#0c0a09" 
                                                strokeWidth="2.5" 
                                            />
                                            {/* Tyre Tread Lines */}
                                            <circle 
                                                cx={wheelX} 
                                                cy="645" 
                                                r="20" 
                                                fill="none" 
                                                stroke="#3f3f46" 
                                                strokeWidth="1.5" 
                                                strokeDasharray="4,4" 
                                            />

                                            {/* Silver Metallic Wheel Rim */}
                                            <circle cx={wheelX} cy="645" r="14" fill="#52525b" stroke="#71717a" strokeWidth="1.5" />
                                            {/* Wheel Center Axle & Lug Nuts */}
                                            <circle cx={wheelX} cy="645" r="7" fill="#d4d4d8" />
                                            <circle cx={wheelX - 4} cy="643" r="1.5" fill="#18181b" />
                                            <circle cx={wheelX + 4} cy="643" r="1.5" fill="#18181b" />
                                            <circle cx={wheelX} cy="649" r="1.5" fill="#18181b" />
                                        </g>
                                    ))}
                                </svg>
                            </div>
                        </div>
                    </div>

                    {/* Bottom Ground Dark Metallic Guide Rail Track with Chrome Rolling Line */}
                    <div className="w-full h-4 sm:h-5 bg-gradient-to-r from-neutral-900 via-neutral-800 to-neutral-900 border-t border-neutral-700 shadow-2xl z-30 shrink-0 flex flex-col justify-center items-center">
                        <div className="w-full h-1 bg-gradient-to-r from-slate-400 via-white to-slate-400 shadow-[0_0_8px_rgba(255,255,255,0.7)]"></div>
                        <div className="w-full h-0.5 bg-neutral-950 mt-0.5"></div>
                    </div>
                </div>
            </div>
        );
    };

    // Aesthetic Style Toggles Bar with Round Corners
    const AestheticPillScroller = ({ onOpenParentHub, onReplayGate }) => {
        const pills = [
            { label: 'Gate Entry ⛩️', icon: 'door-open', onClick: onReplayGate, isAction: true },
            { label: 'Admissions 2026', icon: 'graduation-cap', href: '#admissions', highlight: true },
            { label: 'Sainik Wing', icon: 'shield', href: '#sainik-wing' },
            { label: 'Academics', icon: 'book-open', href: '#academics' },
            { label: 'Results & Posters', icon: 'award', href: '#gallery' },
            { label: 'Director’s Desk', icon: 'user', href: '#director' },
            { label: 'Sports & Games', icon: 'trophy', href: '#activities' },
            { label: 'Campus Life', icon: 'sparkles', href: '#campus-life' },
            { label: 'Directions & Route', icon: 'map-pin', href: '#contact' },
        ];

        return (
            <div className="w-full bg-[#050b16]/95 border-t border-b border-white/10 backdrop-blur-md px-3 sm:px-6 py-2 overflow-x-auto no-scrollbar flex items-center gap-2 sm:gap-2.5 z-40 justify-start lg:justify-center shadow-lg">
                <button 
                    onClick={onOpenParentHub}
                    className="shrink-0 inline-flex items-center gap-1.5 px-3.5 sm:px-4 py-1.5 rounded-full bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-bold text-xs shadow-md hover:scale-105 hover:brightness-110 transition-all cursor-pointer"
                >
                    <Icon name="sliders-horizontal" size={13} />
                    <span>Parent Quick-Hub</span>
                </button>
                {pills.map((pill, i) => (
                    pill.isAction ? (

                            <a href="#hero" className="hover:text-amber-400 transition-colors">Back to Top</a>
                        </div>
                    </div>
                </div>
            </footer>
        );
    };

    const Modal = ({ isOpen, onClose, title, badge = "Official Overview", children }) => {
        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 overflow-y-auto bg-navy-950/80 backdrop-blur-md">
                <div onClick={onClose} className="fixed inset-0"></div>
                <div className="relative bg-white rounded-2xl sm:rounded-3xl shadow-2xl max-w-2xl w-full p-5 sm:p-10 border border-slate-200 z-10">
                    <div className="flex items-start justify-between pb-4 sm:pb-6 border-b border-slate-100">
                        <div>
                            <span className="text-xs font-bold uppercase tracking-widest text-amber-600">{badge}</span>
                            <h3 className="text-xl sm:text-2xl font-bold font-serif text-slate-900 mt-0.5">{title}</h3>
                        </div>
                        <button onClick={onClose} className="p-1.5 sm:p-2 rounded-xl text-slate-400 hover:text-slate-900">
                            <Icon name="x" size={20} />
                        </button>
                    </div>

                    <div className="py-4 sm:py-6 text-slate-600 leading-relaxed text-xs sm:text-base max-h-[65vh] overflow-y-auto no-scrollbar">
                        {children}
                    </div>

                    <div className="pt-3 sm:pt-4 border-t border-slate-100 flex justify-end">
                        <button 
                            onClick={onClose}
                            className="px-5 py-2 rounded-xl bg-navy-900 text-white font-bold text-xs uppercase tracking-wider hover:bg-royal-600 transition-colors"
                        >
                            Close
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // Main App Component
    function App() {
        const [scrolled, setScrolled] = useState(false);
        const [activeModal, setActiveModal] = useState(null);
        const [isParentHubOpen, setIsParentHubOpen] = useState(false);
        const [showGateIntro, setShowGateIntro] = useState(true);

        useEffect(() => {
            const handleScroll = () => {
                setScrolled(window.scrollY > 40);
            };
            window.addEventListener('scroll', handleScroll, { passive: true });
            return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        return (
            <div className="min-h-screen flex flex-col bg-[#f8fafc]">
                {/* Modern Architectural Slider Gate Entrance (Plays on open or can be replayed) */}
                {showGateIntro && (
                    <SchoolGateIntro onComplete={() => setShowGateIntro(false)} />
                )}

                {/* Top Header & Sticky Navigation */}
                <Navbar 
                    scrolled={scrolled} 
                    onOpenParentHub={() => setIsParentHubOpen(true)}
                    onReplayGate={() => setShowGateIntro(true)}
                />

                {/* Main Content */}
                <main className="flex-1">
                    <HeroSection />
                    <MovingTicker />
                    <StorySection onOpenPhilosophyModal={() => setActiveModal({ type: 'philosophy' })} />
                    <WhyChooseSection onSelectFeature={(item) => setActiveModal({ type: 'feature', data: item })} />
                    <AcademicsSection />
                    <GallerySection />
                    <SportsSection />
                    <SainikWingSection />
                    <AnnouncementsSection onSelectAnnouncement={(item) => setActiveModal({ type: 'announcement', data: item })} />
                    <DirectorSection onOpenDirectorModal={() => setActiveModal({ type: 'director' })} />
                    <CampusLifeSection />
                    <MissionVisionSection />
                    <AdmissionsCTASection />
                    <ContactSection />
                </main>

                {/* Footer */}
                <Footer />

                {/* Mobile Bottom Dock for instant Parent Navigation */}
                <MobileBottomParentDock 
                    onOpenParentHub={() => setIsParentHubOpen(true)}
                />

                {/* Parent Quick Links Hub Bottom Sheet */}
                <ParentHubSheet 
                    isOpen={isParentHubOpen}
                    onClose={() => setIsParentHubOpen(false)}
                    onSelectPhilosophy={() => setActiveModal({ type: 'philosophy' })}
                    onSelectDirector={() => setActiveModal({ type: 'director' })}
                />

                {/* Floating WhatsApp on Desktop only to avoid overlapping mobile dock */}
                <aside aria-label="Desktop WhatsApp Communication" className="hidden lg:flex fixed bottom-6 right-6 z-40 flex-col items-end gap-3">
                    <a
                        href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hello!%20I%20am%20visiting%20the%20website%20and%20would%20like%20to%20know%20more%20about%20Shri%20Swaroop%20Public%20School.`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="whatsapp-pulse flex items-center justify-center w-14 h-14 rounded-full bg-[#25D366] text-white shadow-2xl hover:scale-110 transition-transform"
                        title="Chat on WhatsApp"
                    >
                        <i className="fa-brands fa-whatsapp text-3xl"></i>
                    </a>
                </aside>

                {/* Interactive Modals */}
                {activeModal?.type === 'philosophy' && (
                    <Modal 
                        isOpen={true} 
                        onClose={() => setActiveModal(null)} 
                        title="Our Educational Philosophy"
                        badge="Core Doctrine"
                    >
                        <div className="space-y-3 sm:space-y-4">
                            <p className="font-serif text-base sm:text-lg text-slate-800 font-semibold">
                                At Shri Swaroop Public School, we envision a future where every student is equipped with the tools to lead, innovate, and inspire.
                            </p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 my-3">
                                <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-100">
                                    <h5 className="font-bold text-royal-600 text-xs uppercase tracking-wider mb-1">Academic Rigor</h5>
                                    <p className="text-xs text-slate-600 leading-relaxed">We maintain the highest standards of academic excellence, encouraging students to push their intellectual boundaries.</p>
                                </div>
                                <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-100">
                                    <h5 className="font-bold text-royal-600 text-xs uppercase tracking-wider mb-1">Ethical Leadership</h5>
                                    <p className="text-xs text-slate-600 leading-relaxed">Character building is at our core. We instill values of integrity, empathy, and global citizenship.</p>
                                </div>
                            </div>
                            <p className="italic text-slate-500 text-xs sm:text-sm">
                                "Join us as we shape the architects of tomorrow's world."
                            </p>
                        </div>
                    </Modal>
                )}

                {activeModal?.type === 'director' && (
                    <Modal 
                        isOpen={true} 
                        onClose={() => setActiveModal(null)} 
                        title="From the Director's Desk"
                        badge="Leadership Address"
                    >
                        <div className="space-y-3 sm:space-y-4 text-slate-700 text-xs sm:text-base">
                            <p className="font-serif font-bold text-slate-900 text-base sm:text-lg">Dear Students, Parents, and Visitors,</p>
                            <p>It gives me immense pleasure to welcome you to <strong>Swaroop Public Senior Secondary School, Bagar</strong>.</p>
                            <p>Education is not merely about achieving academic excellence; it is about nurturing responsible, confident, compassionate, and morally strong individuals who are prepared to face the challenges of the future. At our school, we are committed to providing a safe, caring, and inspiring learning environment where every child is encouraged to discover their unique talents and reach their full potential.</p>
                            <p>Our dedicated team of educators believes in a balanced approach to education — combining academic excellence with character building, creativity, discipline, sports, technology, and life skills. We strive to instill values such as honesty, respect, responsibility, and perseverance, ensuring that our students grow into responsible citizens and future leaders.</p>
                            <p>In today's rapidly changing world, we continuously adopt innovative teaching methodologies and modern educational practices while preserving our rich cultural and moral values. We strongly believe that the partnership between parents, teachers, and students is the foundation of every child's success.</p>
                            <p>I sincerely thank all our parents for their continued trust and support and encourage every student to dream big, work hard, and never stop learning. Together, let us create a future filled with knowledge, confidence, and excellence.</p>
                            <p>I invite you to explore our website and learn more about the opportunities and vibrant learning environment that make <strong>Swaroop Public Senior Secondary School</strong> a place where young minds are inspired to excel.</p>
                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 sm:p-4 mt-2">
                                <p className="font-serif italic text-amber-900 font-semibold text-sm sm:text-base text-center">
                                    "Together We Learn, Together We Grow, Together We Succeed."
                                </p>
                            </div>
                            <div className="pt-3 border-t border-slate-100">
                                <div className="font-bold font-serif text-slate-900">Mr. Manoj Kumar Bagoria</div>
                                <div className="text-xs text-amber-600 font-semibold uppercase tracking-wider">Director</div>
                                <div className="text-xs text-slate-500 mt-0.5">Swaroop Public Senior Secondary School, Bagar, Rajasthan</div>
                            </div>
                        </div>
                    </Modal>
                )}

                {activeModal?.type === 'feature' && (
                    <Modal 
                        isOpen={true} 
                        onClose={() => setActiveModal(null)} 
                        title={activeModal.data.title}
                        badge="Campus Feature"
                    >
                        <p className="text-sm sm:text-base text-slate-700 leading-relaxed">
                            {activeModal.data.longDesc}
                        </p>
                    </Modal>
                )}

                {activeModal?.type === 'announcement' && (
                    <Modal 
                        isOpen={true} 
                        onClose={() => setActiveModal(null)} 
                        title={activeModal.data.title}
                        badge={activeModal.data.category}
                    >
                        <div className="space-y-2">
                            <span className="text-xs font-bold text-royal-600">{activeModal.data.date}</span>
                            <p className="text-sm sm:text-base text-slate-700 leading-relaxed">
                                {activeModal.data.full}
                            </p>
                        </div>
                    </Modal>
                )}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script></body>
</html>
